name: Go checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Prepare Make and OpenSSL
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            choco install make --no-progress --yes
          elif [[ "$RUNNER_OS" == macOS ]]; then
            brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
            echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Linux UI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libpango-1.0-0 libpangocairo-1.0-0 fonts-noto-cjk
      - name: Check formatting, dependencies, architecture and behavior
        run: make check
      - name: Cross-compile supported targets
        if: runner.os == 'Linux'
        run: make check CHECK_ARGS="--no-tests --cross"
